name: build-arm64
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout patch repo
        uses: actions/checkout@v4
      - name: checkout rustdesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          path: rustdesk
          submodules: recursive
      - name: apply kylin patch
        run: |
          cd rustdesk
          git apply --stat ../kylin-keyboard.patch
          git apply ../kylin-keyboard.patch
          grep -n "PATCH(kylin)" libs/enigo/src/linux/nix_impl.rs
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl wget nasm yasm ninja-build pkg-config \
            g++ libgtk-3-dev libxdo-dev libssl-dev libx11-dev \
            libxrandr-dev libxtst-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev libayatana-appindicator3-dev \
            protobuf-compiler libvpx-dev libpam0g-dev libyuv-dev \
            libclang-dev llvm-dev libunwind-dev libva-dev
      - name: write libyuv pc
        run: |
          echo cHJlZml4PS91c3IKbGliZGlyPS91c3IvbGliL2FhcmNoNjQtbGludXgtZ251CmluY2x1ZGVkaXI9L3Vzci9pbmNsdWRlCgpOYW1lOiBsaWJ5dXYKRGVzY3JpcHRpb246IGxpYnl1diAoc3lzdGVtIHBhY2thZ2Ugc2hpbSkKVmVyc2lvbjogMTg1MApMaWJzOiAtTCR7bGliZGlyfSAtbHl1dgpDZmxhZ3M6IC1JJHtpbmNsdWRlZGlyfQo= | base64 -d > /tmp/libyuv.pc
      - name: libyuv pkg-config shim
        run: |
          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo cp /tmp/libyuv.pc /usr/local/lib/pkgconfig/libyuv.pc
          pkg-config --modversion libyuv || echo "libyuv pc still not found"

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: build rust lib
        run: |
          cd rustdesk
          cargo build --release --lib --features flutter,linux-pkg-config
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk-arm64-kylin
          path: rustdesk/target/release/liblibrustdesk.so

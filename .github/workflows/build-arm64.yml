name: build-arm64
on:
  workflow_dispatch:
env:
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout patch repo
        uses: actions/checkout@v4
      - name: checkout rustdesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          path: rustdesk
          submodules: recursive
      - name: apply kylin patch
        run: |
          cd rustdesk
          git apply --stat ../kylin-keyboard.patch
          git apply ../kylin-keyboard.patch
          grep -n "PATCH(kylin)" libs/enigo/src/linux/nix_impl.rs
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl wget nasm yasm ninja-build pkg-config \
            g++ libgtk-3-dev libxdo-dev libssl-dev libx11-dev \
            libxrandr-dev libxtst-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev libayatana-appindicator3-dev \
            protobuf-compiler libvpx-dev libpam0g-dev libyuv-dev \
            libclang-dev llvm-dev libunwind-dev libva-dev
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: install flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
      - name: generate bridge
        run: |
          cd rustdesk
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          ls -la src/bridge_generated.rs src/bridge_generated.io.rs
      - name: build rust lib
        run: |
          cd rustdesk
          cargo build --release --lib --features flutter,linux-pkg-config
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk-arm64-kylin
          path: rustdesk/target/release/liblibrustdesk.so

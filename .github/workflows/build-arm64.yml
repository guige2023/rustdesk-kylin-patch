name: build-arm64
on:
  workflow_dispatch:
env:
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: install base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl wget unzip ca-certificates \
            build-essential cmake nasm yasm ninja-build pkg-config clang llvm libclang-dev \
            libgtk-3-dev libxdo-dev libssl-dev libx11-dev libxrandr-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libayatana-appindicator3-dev protobuf-compiler libvpx-dev libpam0g-dev libaom-dev python3
      - name: checkout rustdesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          path: rustdesk
          submodules: recursive
      - name: checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patch
      - name: apply kylin patch
        run: |
          cd rustdesk
          git apply ../patch/kylin-keyboard.patch
          grep -n "PATCH(kylin)" libs/enigo/src/linux/nix_impl.rs
      - name: install rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - name: build libyuv from source
        run: |
          git clone --depth 1 https://github.com/lemenkov/libyuv /opt/libyuv
          cd /opt/libyuv && mkdir -p buildt && cd buildt
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr && make -j$(nproc) && make install
          printf 'prefix=/usr\nlibdir=/usr/lib/aarch64-linux-gnu\nincludedir=/usr/include\n\nName: libyuv\nDescription: libyuv\nVersion: 1850\nLibs: -L${libdir} -lyuv\nCflags: -I${includedir}\n' > /usr/local/lib/pkgconfig/libyuv.pc 2>/dev/null || true
          pkg-config --modversion libyuv || true
      - name: install flutter 3.44.0
        run: |
          git clone --depth 1 -b 3.44.0 https://github.com/flutter/flutter /opt/flutter
          /opt/flutter/bin/flutter --version
      - name: install frb codegen
        run: |
          source $HOME/.cargo/env
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
      - name: generate bridge
        run: |
          source $HOME/.cargo/env
          export PATH=/opt/flutter/bin:$PATH
          cd rustdesk
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          ls -la src/bridge_generated.rs src/bridge_generated.io.rs
      - name: build rust lib
        run: |
          source $HOME/.cargo/env
          export PATH=/opt/flutter/bin:$PATH
          cd rustdesk
          cargo build --release --lib --features flutter,linux-pkg-config
      - name: bundle runtime libs
        run: |
          mkdir -p bundle
          cp rustdesk/target/release/liblibrustdesk.so bundle/
          ldd rustdesk/target/release/liblibrustdesk.so | awk '{for(i=1;i<=NF;i++) if ($i ~ /^lib.*\.so/) print $i}' | sort -u > bundle/libs.txt || true
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk-arm64-kylin
          path: |
            bundle/liblibrustdesk.so
            bundle/libs.txt

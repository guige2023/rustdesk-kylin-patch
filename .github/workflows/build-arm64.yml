name: build-arm64
on:
  workflow_dispatch:
env:
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: install base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl wget unzip zip ca-certificates \
            build-essential cmake nasm yasm ninja-build pkg-config clang llvm libclang-dev perl \
            libgtk-3-dev libxdo-dev libssl-dev libx11-dev libxrandr-dev libxtst-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libaom-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libayatana-appindicator3-dev protobuf-compiler libvpx-dev libpam0g-dev libaom-dev libopus-dev python3
      - name: build libaom 3.x from source
        run: |
          git clone --depth 1 -b v3.8.3 https://aomedia.googlesource.com/aom /opt/aomsrc
          mkdir -p /opt/aomsrc/build && cd /opt/aomsrc/build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=0 -DENABLE_TESTS=0 -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 \
            -DENABLE_TOOLS=0
          make -j$(nproc) && make install
          printf 'prefix=/usr/local\nlibdir=/usr/local/lib\nincludedir=/usr/local/include\n\nName: aom\nDescription: libaom 3.x static\nVersion: 3.8.3\nLibs: -L${libdir} -laom -lm\nCflags: -I${includedir}\n' > /usr/local/lib/pkgconfig/aom.pc
          pkg-config --modversion aom

      - name: checkout rustdesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          path: rustdesk
          submodules: recursive
      - name: checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patch
      - name: apply kylin patch
        run: |
          cd rustdesk
          git apply ../patch/kylin-keyboard.patch
          grep -n "PATCH(kylin)" libs/enigo/src/linux/nix_impl.rs
      - name: install rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable -c rustfmt
      - name: build libyuv from source (strip i8mm/sve flags not supported by focal gcc9)
        run: |
          git clone https://github.com/lemenkov/libyuv /opt/libyuv
          cd /opt/libyuv
          git checkout $(git rev-list -1 --before="2023-06-01" HEAD)
          mkdir -p buildt && cd buildt
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc) && make install
          mkdir -p /usr/local/lib/pkgconfig
          printf 'prefix=/usr\nlibdir=/usr/lib/aarch64-linux-gnu\nincludedir=/usr/include\n\nName: libyuv\nDescription: libyuv\nVersion: 1850\nLibs: -L${libdir} -lyuv\nCflags: -I${includedir}\n' > /usr/local/lib/pkgconfig/libyuv.pc
          pkg-config --modversion libyuv
      - name: install flutter 3.44.0
        run: |
          git clone --depth 1 -b 3.44.0 https://github.com/flutter/flutter /opt/flutter
          /opt/flutter/bin/flutter --version
      - name: install frb codegen
        run: |
          source $HOME/.cargo/env
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
      - name: generate bridge
        run: |
          source $HOME/.cargo/env
          export PATH=/opt/flutter/bin:$PATH
          cd rustdesk
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          ls -la src/bridge_generated.rs src/bridge_generated.io.rs
      - name: vpx pkg-config shim
        run: |
          mkdir -p /usr/local/lib/pkgconfig
          echo cHJlZml4PS91c3IKbGliZGlyPS91c3IvbGliL2FhcmNoNjQtbGludXgtZ251CmluY2x1ZGVkaXI9L3Vzci9pbmNsdWRlCgpOYW1lOiB2cHgKRGVzY3JpcHRpb246IFdlYk0gVlA4L1ZQOSAoc3lzdGVtIHBhY2thZ2Ugc2hpbSkKVmVyc2lvbjogMS44CkxpYnM6IC1MJHtsaWJkaXJ9IC1sdnB4CkNmbGFnczogLUkke2luY2x1ZGVkaXJ9Cg== | base64 -d > /usr/local/lib/pkgconfig/vpx.pc
          pkg-config --modversion vpx || echo "WARNING: vpx pc still missing"

      - name: debug vpx headers
        run: |
          ls -la /usr/include/vpx/ 2>&1 | head -5 || true
          pkg-config --cflags vpx || true
          find /usr -name "vp8.h" 2>/dev/null | head -3
      - name: build rust lib
        run: |
          source $HOME/.cargo/env
          export PATH=/opt/flutter/bin:$PATH
          cd rustdesk
          cargo build --release --lib --features flutter,linux-pkg-config
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk-arm64-kylin
          path: rustdesk/target/release/liblibrustdesk.so
